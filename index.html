<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miku-OS</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

    <div id="boot-screen">
        <div class="boot-box">
            <div class="boot-header">
                <span>Miku-OS Kernel v1.0.0 (tty1)</span>
                <span class="status-indicator">BOOTING</span>
            </div>
            <div class="boot-content">
                <div class="boot-gif-container">
                    <img alt="Miku Boot" class="miku-gif" />
                </div>
                <div class="boot-terminal" id="boot-terminal"></div>
            </div>
        </div>
    </div>

    <header class="top-bar os-ui-hidden" id="topBar">
        <div class="top-bar-left">
            <span class="os-title">Miku-OS</span>
        </div>
        <div class="top-bar-right">
            <span id="date"></span>
            <span id="time"></span>
        </div>
    </header>

    <main class="desktop os-ui-hidden" id="desktop">
        <input type="file" id="bg-upload" accept="image/*" style="display: none;">
    </main>

    <footer class="bottom-bar os-ui-hidden" id="bottomBar">
        <div class="mac-dock-container">
            <div class="mac-dock" id="macDock">
                <button class="dock-app" data-app="google" data-title="Google">
                    <img src="./src/assets/icons/google.png" alt="Google" class="app-icon-img" />
                </button>
                <button class="dock-app" data-app="wikipedia" data-title="Wikipedia">
                    <img src="./src/assets/icons/wikipedia.png" alt="Wikipedia" class="app-icon-img" />
                </button>
                <button class="dock-app" data-app="calculator" data-title="Calculator">
                    <img src="./src/assets/icons/calculator.png" alt="Calculator" class="app-icon-img" />
                </button>
                <button class="dock-app" data-app="notes" data-title="Notes">
                    <img src="./src/assets/icons/notes.png" alt="Notes" class="app-icon-img" />
                </button>
                <button class="dock-app" data-app="miku-folder" data-title="miku-folder">
                    <img src="./src/assets/icons/miku-folder.png" alt="miku-folder" class="app-icon-img" />
                </button>
                <button class="dock-app" data-app="terminal" data-title="Terminal">
                    <img src="./src/assets/icons/terminal.png" alt="Terminal" class="app-icon-img" />
                </button>
            </div>
        </div>

        <div class="widgets-corner">
            <div class="hover-widget weather-trigger">
                <div class="widget-badge" id="weatherBadge">🌤️ --°C</div>
                <div class="popup-window">
                    <div class="popup-header">
                        <h3>Current Weather</h3>
                        <span class="location">Patna, Bihar</span>
                    </div>
                    <div class="weather-body">
                        <div class="temp-display" id="weatherTemp">--°C</div>
                        <div class="condition" id="weatherCondition">Syncing...</div>
                        <div class="details">
                            <div id="weatherHumidity">Humidity: --%</div>
                            <div id="weatherWind">Wind: -- km/h</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hover-widget calendar-trigger">
                <div class="widget-badge" id="calendarBadge">📅 Today</div>
                <div class="popup-window cal-popup">
                    <div class="popup-header cal-header">
                        <button id="cal-prev">&lt;</button>
                        <h3 id="cal-month-year">Calendar</h3>
                        <button id="cal-next">&gt;</button>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
